    <script>
      // Some embedded/occluded browsers starve requestAnimationFrame, freezing
      // the 3D scene. Race every frame against a 250ms timer fallback — when
      // native rAF flows normally the timer is a no-op.
      ;(function () {
        var nativeRaf = window.requestAnimationFrame.bind(window)
        window.requestAnimationFrame = function (cb) {
          var fired = false
          var run = function (t) {
            if (fired) return
            fired = true
            cb(t)
          }
          nativeRaf(run)
          setTimeout(function () {
            run(performance.now())
          }, 250)
        }
      })()
    </script>
  </body>
